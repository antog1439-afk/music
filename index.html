<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Угадай трек</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --success-color: #31a24c;
            --error-color: #e0245e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--hint-color);
            font-size: 14px;
        }

        .cover-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background-color: var(--card-bg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            position: relative;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: #fff;
            border-color: #fff;
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: #fff;
            border-color: #fff;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 60vh;
            gap: 20px;
        }

        .result-score {
            font-size: 48px;
            font-weight: 800;
            color: var(--button-color);
        }

        .result-text {
            font-size: 18px;
            color: var(--hint-color);
        }

        .main-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .main-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container" id="game-screen">
        <div class="header">
            <h1>🎵 Угадай трек</h1>
            <p id="greeting">Привет!</p>
        </div>

        <div class="cover-container">
            <img id="track-cover" src="" alt="Обложка">
        </div>

        <div class="options" id="options-container">
            <!-- Кнопки вариантов будут здесь -->
        </div>
        
        <div style="text-align: center; color: var(--hint-color); font-size: 14px; margin-top: 10px;">
            Вопрос <span id="question-number">1</span> из 5
        </div>
    </div>

    <div class="result-screen" id="result-screen">
        <h1>Игра окончена!</h1>
        <div class="result-score" id="final-score">0/5</div>
        <p class="result-text" id="final-text">Неплохо!</p>
        
        <button class="main-btn" onclick="restartGame()">Играть снова</button>
        <button class="main-btn" style="background-color: var(--card-bg); color: var(--text-color);" onclick="shareResult()">Поделиться</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.ready();  // Сообщаем, что приложение готово

        // Приветствие по имени
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}! Проверим твои знания?`;
        }

        // ===== БАЗА ТРЕКОВ (Здесь можно менять данные) =====
        // В будущем бот может передавать этот массив через tg.sendData
        const TRACKS = [
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600", // Асия
                correct: "Асия — Дом",
                options: ["Асия — Дом", "Zivert — Life", "Баста — Сансара", "Кино — Группа крови"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600", // Кино
                correct: "Кино — Группа крови",
                options: ["Кино — Группа крови", "Асия — Останься", "Мари Краймбрери — Пряталась в ванной", "Miyagi — Captain"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600", // Асия
                correct: "Асия — Останься",
                options: ["Асия — Останься", "Zivert — Beverly Hills", "Баста — Выпускной", "Big Baby Tape — Gimme the Loot"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600", // Кино
                correct: "Кино — Звезда по имени Солнце",
                options: ["Кино — Звезда по имени Солнце", "Zivert — Credo", "Баста — Медлячок", "ANNA ASTI — Феникс"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600", // Кино
                correct: "Кино — Перемен",
                options: ["Кино — Перемен", "Асия — 911", "Zivert — Fly", "Баста — Мама"]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 5; // Берем первые 5 вопросов
        let shuffledTracks = [];

        // Функция для перемешивания массива
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            shuffledTracks = shuffleArray([...TRACKS]).slice(0, totalQuestions);
            currentQuestion = 0;
            score = 0;
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            const track = shuffledTracks[currentQuestion];
            document.getElementById('track-cover').src = track.cover;
            document.getElementById('question-number').innerText = currentQuestion + 1;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Очищаем старые кнопки

            // Перемешиваем варианты ответов
            const shuffledOptions = shuffleArray([...track.options]);

            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option, track.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            // Блокируем все кнопки
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                // Находим правильную кнопку и подсвечиваем ее
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            // Переходим к следующему вопросу через 1.5 секунды
            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1500);
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            document.getElementById('final-score').innerText = `${score}/${totalQuestions}`;
            
            const finalText = document.getElementById('final-text');
            if (score === totalQuestions) {
                finalText.innerText = "Вау! Ты настоящий меломан! 🎧";
            } else if (score >= 3) {
                finalText.innerText = "Неплохо! Но есть куда расти. 🎵";
            } else {
                finalText.innerText = "Нужно больше слушать музыку! 📻";
            }
        }

        function restartGame() {
            startGame();
        }

        function shareResult() {
            const text = `Я угадал ${score} из ${totalQuestions} треков в игре "Угадай трек"! А ты сможешь?`;
            const url = `https://t.me/share/url?url=${encodeURIComponent('https://t.me/Inmizic_bot')}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(url);
        }

        // Запускаем игру при загрузке
        startGame();

    </script>
</body>
</html>
