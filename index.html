<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Угадай исполнителя</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            padding-bottom: 40px;
            box-sizing: border-box;
            z-index: 1;
            margin-top: 10px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin: 0;
        }

        /* Блок с названием трека */
        .track-title-container {
            width: 100%;
            min-height: 150px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .track-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .question-text {
            text-align: center;
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 10px;
        }

        /* Кнопки вариантов */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.8);
            border-color: #2ecc71;
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.8);
            border-color: #e74c3c;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        /* Экран результатов */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            animation: fadeIn 0.5s ease;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-score {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 10px 0;
        }

        .result-text {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
        }

        .main-btn {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .main-btn:active {
            transform: scale(0.97);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="game-screen">
        <div class="glass-panel">
            <div class="header">
                <h1>🎵 Угадай исполнителя</h1>
                <p id="greeting">Проверь, насколько хорошо ты знаешь современную музыку!</p>
            </div>

            <div class="question-text">Кто поет этот трек?</div>

            <!-- Блок с названием трека -->
            <div class="track-title-container">
                <div class="track-title" id="track-title">Название трека</div>
            </div>

            <div class="options" id="options-container">
                <!-- Кнопки вариантов -->
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 3%;"></div>
            </div>
        </div>
    </div>

    <div class="container result-screen" id="result-screen">
        <div class="glass-panel" style="width: 100%;">
            <h1>Игра окончена!</h1>
            <div class="result-score" id="final-score">0/30</div>
            <p class="result-text" id="final-text">Неплохо!</p>
            
            <button class="main-btn" onclick="restartGame()">Играть снова</button>
            <button class="main-btn" style="background: rgba(255,255,255,0.2); box-shadow: none;" onclick="shareResult()">Поделиться</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}! Проверим твои знания?`;
        }

        // ===== БАЗА ВОПРОСОВ (30 СОВРЕМЕННЫХ ТРЕКОВ) =====
        const TRACKS = [
            { track: "Дом", correct: "Асия", options: ["Асия", "Zivert", "Мари Краймбрери", "ANNA ASTI"] },
            { track: "Останься", correct: "Асия", options: ["Асия", "Клава Кока", "Zivert", "NЮ"] },
            { track: "911", correct: "Асия", options: ["Асия", "Мот", "Дима Билан", "Лолита"] },
            { track: "Life", correct: "Zivert", options: ["Zivert", "Асия", "Полина Гагарина", "Ёлка"] },
            { track: "Credo", correct: "Zivert", options: ["Zivert", "Мари Краймбрери", "Клава Кока", "Нюша"] },
            { track: "Beverly Hills", correct: "Zivert", options: ["Zivert", "ANNA ASTI", "Баста", "Тимати"] },
            { track: "Кино", correct: "Макан", options: ["Макан", "Кино", "Баста", "Скриптонит"] },
            { track: "Gimme the Loot", correct: "Big Baby Tape", options: ["Big Baby Tape", "Макан", "Кизару", "Моргенштерн"] },
            { track: "Пряталась в ванной", correct: "Мари Краймбрери", options: ["Мари Краймбрери", "Клава Кока", "Асия", "Zivert"] },
            { track: "Феникс", correct: "ANNA ASTI", options: ["ANNA ASTI", "Zivert", "Мари Краймбрери", "Полина Гагарина"] },
            { track: "Пьяная", correct: "Клава Кока", options: ["Клава Кока", "Ольга Бузова", "Асия", "Zivert"] },
            { track: "Сансара", correct: "Баста", options: ["Баста", "Кино", "Макан", "Miyagi"] },
            { track: "Выпускной", correct: "Баста", options: ["Баста", "Тимати", "Мот", "Артур Пирожков"] },
            { track: "Медлячок", correct: "Баста", options: ["Баста", "Кино", "Макан", "Дима Билан"] },
            { track: "Captain", correct: "Miyagi", options: ["Miyagi", "Баста", "Big Baby Tape", "Макан"] },
            { track: "Группа крови", correct: "Кино", options: ["Кино", "Баста", "Макан", "Скриптонит"] },
            { track: "Перемен", correct: "Кино", options: ["Кино", "Баста", "Макан", "Miyagi"] },
            { track: "Звезда по имени Солнце", correct: "Кино", options: ["Кино", "Баста", "Макан", "Асия"] },
            { track: "Малиновая Лада", correct: "Мот", options: ["Мот", "Тимати", "Дима Билан", "Артур Пирожков"] },
            { track: "Ты не моя пара", correct: "Дима Билан", options: ["Дима Билан", "Мот", "Тимати", "Николай Басков"] },
            { track: "Пчеловод", correct: "Лолита", options: ["Лолита", "Ольга Бузова", "Нюша", "Ёлка"] },
            { track: "Останься", correct: "Макан", options: ["Макан", "Асия", "Big Baby Tape", "Miyagi"] },
            { track: "Дом", correct: "Асия", options: ["Асия", "Zivert", "Мари Краймбрери", "ANNA ASTI"] },
            { track: "Life", correct: "Zivert", options: ["Zivert", "Асия", "Полина Гагарина", "Ёлка"] },
            { track: "Gimme the Loot", correct: "Big Baby Tape", options: ["Big Baby Tape", "Макан", "Кизару", "Моргенштерн"] },
            { track: "Пряталась в ванной", correct: "Мари Краймбрери", options: ["Мари Краймбрери", "ANNA ASTI", "Ёлка", "Нюша"] },
            { track: "Феникс", correct: "ANNA ASTI", options: ["ANNA ASTI", "Zivert", "Мари Краймбрери", "Клава Кока"] },
            { track: "Пьяная", correct: "Клава Кока", options: ["Клава Кока", "Ольга Бузова", "Нюша", "Ёлка"] },
            { track: "Сансара", correct: "Баста", options: ["Баста", "Кино", "Макан", "Miyagi"] },
            { track: "Кино", correct: "Макан", options: ["Макан", "Кино", "Скриптонит", "Баста"] }
        ];

        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = 30;
        let shuffledTracks = [];

        // 1. Функция перемешивания (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            shuffledTracks = shuffleArray([...TRACKS]);
            currentQuestion = 0;
            score = 0;
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            const track = shuffledTracks[currentQuestion];
            
            // Показываем название трека
            document.getElementById('track-title').innerText = `«${track.track}»`;

            // Обновляем прогресс-бар
            const progressPercent = ((currentQuestion) / totalQuestions) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            // 2. Перемешиваем варианты
            let shuffledOptions = shuffleArray([...track.options]);

            // 3. ГАРАНТИРУЕМ, что правильный ответ НЕ на первом месте
            if (shuffledOptions[0] === track.correct) {
                // Если правильный ответ оказался первым, меняем его местами со вторым
                [shuffledOptions[0], shuffledOptions[1]] = [shuffledOptions[1], shuffledOptions[0]];
            }

            // 4. Отрисовываем кнопки
            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option, track.correct);
                optionsContainer.appendChild(btn);
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkAnswer(btn, selected, correct) {
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1200);
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            document.getElementById('final-score').innerText = `${score}/${totalQuestions}`;
            
            const finalText = document.getElementById('final-text');
            if (score === totalQuestions) {
                finalText.innerText = "Вау! Ты настоящий меломан! 🎧";
            } else if (score >= 20) {
                finalText.innerText = "Отличный результат! Ты знаешь толк в музыке. 🎵";
            } else if (score >= 10) {
                finalText.innerText = "Неплохо! Но есть куда расти. 🎶";
            } else {
                finalText.innerText = "Нужно больше слушать музыку! 📻";
            }
        }

        function restartGame() {
            startGame();
        }

        function shareResult() {
            const text = `Я угадал ${score} из ${totalQuestions} треков в игре "Угадай исполнителя"! А ты сможешь?`;
            const url = `https://t.me/share/url?url=${encodeURIComponent('https://t.me/Inmizic_bot')}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(url);
        }

        startGame();
    </script>
</body>
</html>
