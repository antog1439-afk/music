<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный Тест</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #2ecc71;
            margin-bottom: 20px;
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .option {
            background-color: #0f3460;
            color: white;
            border: 2px solid #2ecc71;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }
        .option:hover {
            background-color: #2ecc71;
            color: #1a1a2e;
        }
        .option.correct {
            background-color: #2ecc71;
            color: #1a1a2e;
        }
        .option.wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }
        #next-btn, #finish-btn {
            background-color: #2ecc71;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            width: 100%;
        }
        #next-btn:hover, #finish-btn:hover {
            background-color: #27ae60;
        }
        .hidden {
            display: none;
        }
        .result {
            font-size: 20px;
            margin-top: 20px;
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Музыкальный Тест</h1>
        
        <div id="quiz-container">
            <div id="question-text" class="question">Загрузка вопроса...</div>
            <div id="options-container"></div>
            <button id="next-btn">Следующий вопрос ➡️</button>
        </div>

        <div id="result-container" class="hidden">
            <div id="result-text" class="result"></div>
            <button id="finish-btn">Завершить тест ✅</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        // Вопросы для теста
        const questions = [
            {
                question: "Кто написал трек «Останься»?",
                options: ["Асия", "Баста", "Скриптонит", "Zivert"],
                correct: 0
            },
            {
                question: "Какой трек принадлежит группе «Кино»?",
                options: ["Группа крови", "Сансара", "911", "Мало половин"],
                correct: 0
            },
            {
                question: "Кто исполняет трек «Сансара»?",
                options: ["Баста", "Оксимирон", "Моргенштерн", "Тимати"],
                correct: 0
            },
            {
                question: "Какой артист известен треком «Cadillac»?",
                options: ["Моргенштерн", "Big Baby Tape", "FACE", "Кизару"],
                correct: 0
            },
            {
                question: "Кто поёт песню «Пятница»?",
                options: ["Zivert", "Асия", "Мари Краймбрери", "Клава Кока"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const finishBtn = document.getElementById('finish-btn');

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionText.textContent = `${currentQuestion + 1}. ${q.question}`;
            optionsContainer.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('div');
                btn.classList.add('option');
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            nextBtn.style.display = 'none';
        }

        function selectAnswer(index, btn) {
            // Блокируем все кнопки после ответа
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.style.pointerEvents = 'none');

            const correctIndex = questions[currentQuestion].correct;

            if (index === correctIndex) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allOptions[correctIndex].classList.add('correct'); // Показать правильный
            }

            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            resultText.textContent = `Вы ответили правильно на ${score} из ${questions.length} вопросов!`;
            
            // Показываем кнопку "Завершить" только если набрано больше половины
            if (score >= 3) {
                finishBtn.style.display = 'block';
                finishBtn.textContent = "✅ Отправить результат и разблокировать";
            } else {
                finishBtn.style.display = 'block';
                finishBtn.textContent = "🔄 Попробовать снова";
                finishBtn.onclick = () => location.reload(); // Перезагрузка страницы
            }
        }

        // Действие при нажатии "Завершить"
        finishBtn.onclick = () => {
            if (score >= 3) {
                // ОТПРАВЛЯЕМ СИГНАЛ БОТУ, ЧТО ТЕСТ ПРОЙДЕН
                tg.sendData(JSON.stringify({ action: "test_passed" }));
                tg.close(); // Закрываем Mini App
            }
        };

        // Запуск
        loadQuestion();
    </script>
</body>
</html>
