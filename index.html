<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Угадай трек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Красивый анимированный фон */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Убираем скролл на главном экране */
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            z-index: 1;
        }

        /* Стеклянная карточка */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin: 0;
        }

        /* Обложка с эффектом */
        .cover-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        /* Кнопки вариантов */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.8);
            border-color: #2ecc71;
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.8);
            border-color: #e74c3c;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        /* Экран результатов */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-score {
            font-size: 64px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 10px 0;
        }

        .result-text {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
        }

        .main-btn {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .main-btn:active {
            transform: scale(0.97);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="game-screen">
        <div class="glass-panel">
            <div class="header">
                <h1>🎵 Угадай трек</h1>
                <p id="greeting">Проверь свой музыкальный вкус!</p>
            </div>

            <div class="cover-container">
                <img id="track-cover" src="" alt="Обложка">
            </div>

            <div class="options" id="options-container">
                <!-- Кнопки вариантов -->
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 10%;"></div>
            </div>
        </div>
    </div>

    <div class="container result-screen" id="result-screen">
        <div class="glass-panel" style="width: 100%;">
            <h1>Игра окончена!</h1>
            <div class="result-score" id="final-score">0/10</div>
            <p class="result-text" id="final-text">Неплохо!</p>
            
            <button class="main-btn" onclick="restartGame()">Играть снова</button>
            <button class="main-btn" style="background: rgba(255,255,255,0.2); box-shadow: none;" onclick="shareResult()">Поделиться</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}! Проверим твои знания?`;
        }

        // ===== БАЗА ТРЕКОВ (10 РЕАЛЬНЫХ ТРЕКОВ) =====
        const TRACKS = [
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Асия — Дом",
                options: ["Асия — Дом", "Zivert — Life", "Баста — Сансара", "Кино — Группа крови"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Асия — Останься",
                options: ["Асия — Останься", "Баста — Выпускной", "Макан — Кино", "Big Baby Tape — Gimme the Loot"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600",
                correct: "Кино — Группа крови",
                options: ["Кино — Группа крови", "Асия — 911", "Zivert — Credo", "Miyagi — Captain"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600",
                correct: "Кино — Звезда по имени Солнце",
                options: ["Кино — Звезда по имени Солнце", "Баста — Медлячок", "ANNA ASTI — Феникс", "Клава Кока — Пьяная"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Zivert — Life",
                options: ["Zivert — Life", "Асия — Дом", "Мари Краймбрери — Пряталась в ванной", "Баста — Мама"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Баста — Сансара",
                options: ["Баста — Сансара", "Кино — Перемен", "Асия — Останься", "Zivert — Beverly Hills"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/4427/6b6e2c80.a.46189-1/600x600",
                correct: "Кино — Перемен",
                options: ["Кино — Перемен", "Макан — Кино", "Big Baby Tape — Gimme the Loot", "Асия — 911"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Мари Краймбрери — Пряталась в ванной",
                options: ["Мари Краймбрери — Пряталась в ванной", "Баста — Выпускной", "Zivert — Credo", "Кино — Звезда по имени Солнце"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "Big Baby Tape — Gimme the Loot",
                options: ["Big Baby Tape — Gimme the Loot", "Асия — Дом", "Кино — Группа крови", "Баста — Медлячок"]
            },
            {
                cover: "https://avatars.yandex.net/get-music-content/5839186/8f1e4b4f.a.145322780-1/600x600",
                correct: "ANNA ASTI — Феникс",
                options: ["ANNA ASTI — Феникс", "Zivert — Life", "Мари Краймбрери — Пряталась в ванной", "Асия — Останься"]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = 10;
        let shuffledTracks = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            shuffledTracks = shuffleArray([...TRACKS]);
            currentQuestion = 0;
            score = 0;
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            const track = shuffledTracks[currentQuestion];
            document.getElementById('track-cover').src = track.cover;
            
            // Обновляем прогресс-бар
            const progressPercent = ((currentQuestion) / totalQuestions) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            const shuffledOptions = shuffleArray([...track.options]);

            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option, track.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allButtons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1200);
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            document.getElementById('final-score').innerText = `${score}/${totalQuestions}`;
            
            const finalText = document.getElementById('final-text');
            if (score === totalQuestions) {
                finalText.innerText = "Вау! Ты настоящий меломан! 🎧";
            } else if (score >= 7) {
                finalText.innerText = "Отличный результат! Ты знаешь толк в музыке. 🎵";
            } else if (score >= 4) {
                finalText.innerText = "Неплохо! Но есть куда расти. 🎶";
            } else {
                finalText.innerText = "Нужно больше слушать музыку! 📻";
            }
        }

        function restartGame() {
            startGame();
        }

        function shareResult() {
            const text = `Я угадал ${score} из ${totalQuestions} треков в игре "Угадай трек"! А ты сможешь?`;
            const url = `https://t.me/share/url?url=${encodeURIComponent('https://t.me/Inmizic_bot')}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(url);
        }

        startGame();
    </script>
</body>
</html>
